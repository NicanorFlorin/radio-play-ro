<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jetix Generation 🎬</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .logo {
      max-width: 200px;
      margin: 20px auto 10px;
    }

    .navbar {
      margin-bottom: 30px;
    }

    .navbar a {
      display: inline-block;
      margin: 0 10px;
      padding: 10px 15px;
      background-color: #ff2d2d;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    .navbar a:hover {
      background-color: #cc0000;
    }

    h2 {
      color: #ff2d2d;
      margin-bottom: 10px;
    }

    #video-container {
      position: relative;
      display: inline-block;
      width: 90%;
      max-width: 900px;
      margin-bottom: 20px;
    }

    video {
      width: 100%;
      border-radius: 10px;
      border: 2px solid #222;
      box-shadow: 0 0 15px #ff2d2d66;
      background-color: #000;
    }

    #current-title {
      margin: 10px 0;
      font-size: 18px;
      color: #ff4747;
    }

    #next-btn {
      background-color: #ff2d2d;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 8px;
      font-weight: bold;
      transition: background 0.3s;
    }

    #next-btn:hover {
      background-color: #cc0000;
    }

    #playlist {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-top: 30px;
    }

    .video-item {
      width: 160px;
      background: #1c1c1c;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .video-item:hover {
      transform: scale(1.05);
      box-shadow: 0 0 10px #ff2d2d80;
    }

    .video-item.active {
      border: 2px solid #ff2d2d;
    }

    .thumb {
      width: 100%;
      height: 90px;
      object-fit: cover;
    }

    .title {
      padding: 8px;
      font-size: 14px;
      color: #fff;
    }

    footer {
      margin-top: 40px;
      font-size: 14px;
      color: #777;
    }

    @media (max-width: 600px) {
      .video-item {
        width: 45%;
      }
    }
  </style>
</head>
<body>

  <img src="https://i.imgur.com/TtszlKF.jpeg" alt="Jetix Logo" class="logo" />

  <nav class="navbar">
    <a href="index.html">🏠 Acasă</a>
    <a href="despre.html">👤 Despre</a>
    <a href="jetix.html">🎬 Jetix Generation</a>
  </nav>

  <h2>Jetix Generation 🎬</h2>

  <div id="video-container">
    <video id="video" controls autoplay></video>
    <div id="current-title">Se încarcă...</div>
    <button id="next-btn">⏭️ Următorul film</button>
  </div>

  <div id="playlist"></div>

  <footer>
    &copy; 2025 Jetix Generation | Un proiect Radio Play RO
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const playlist = [
      {
        title: "Totally Spies - Episodul 1",
        url: "https://stream.mux.com/IDUL_TAU1.m3u8",
        thumb: "https://via.placeholder.com/320x180?text=Totally+Spies"
      },
      {
        title: "Power Rangers - Dino Thunder",
        url: "https://stream.mux.com/IDUL_TAU2.m3u8",
        thumb: "https://via.placeholder.com/320x180?text=Power+Rangers"
      },
      {
        title: "Jetix - Promo Nostalgie",
        url: "https://stream.mux.com/IDUL_TAU3.m3u8",
        thumb: "https://via.placeholder.com/320x180?text=Promo+Jetix"
      }
    ];

    const video = document.getElementById("video");
    const titleEl = document.getElementById("current-title");
    const nextBtn = document.getElementById("next-btn");
    const playlistDiv = document.getElementById("playlist");
    let currentIndex = 0;
    let hls;

    function playVideo(index) {
      const videoSrc = playlist[index].url;
      titleEl.textContent = playlist[index].title;

      if (hls) hls.destroy();
      if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(videoSrc);
        hls.attachMedia(video);
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = videoSrc;
      }

      video.play();
      currentIndex = index;
      updateActive();
    }

    video.addEventListener("ended", nextVideo);
    nextBtn.addEventListener("click", nextVideo);

    function nextVideo() {
      currentIndex = (currentIndex + 1) % playlist.length;
      playVideo(currentIndex);
    }

    function renderPlaylist() {
      playlistDiv.innerHTML = playlist
        .map((item, i) => `
          <div class="video-item" onclick="playVideo(${i})">
            <img class="thumb" src="${item.thumb}" alt="${item.title}">
            <div class="title">${item.title}</div>
          </div>`)
        .join("");
    }

    function updateActive() {
      const items = playlistDiv.querySelectorAll(".video-item");
      items.forEach((el, i) => {
        el.classList.toggle("active", i === currentIndex);
      });
    }

    renderPlaylist();
    playVideo(currentIndex);
  </script>

</body
